<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="mow-favicon.svg" type="image/svg+xml">
<title>Member Login — MOW NSW Members Portal</title>
<link rel="stylesheet" href="styles.css?v=62">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="lmark">MOW</div>
    <h1>Member login</h1>
    <div class="sub">Sign in to access your Member Hub.</div>

    <div class="field">
      <label>Email address</label>
      <input type="email" placeholder="you@yourservice.org.au">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" style="width:100%;justify-content:center" type="button">Sign in</button>
    <p class="fine"><a href="#" style="color:var(--teal);text-decoration:none">Forgot your password?</a></p>
    <p class="fine">Not a member yet? <a href="#" style="color:var(--teal);text-decoration:none">Find out how to join</a></p>
  </div>
</div>

</body>
</html>
